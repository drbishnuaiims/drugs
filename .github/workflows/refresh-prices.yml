name: Thomson Clinic Price Refresh

on:
  schedule:
    # Runs every day at 06:00 UTC
    # = 11:30 AM IST
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  refresh-prices:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run price refresh
        run: npm run refresh-prices

      - name: Check for changes
        id: changes
        run: |
          git status --short

      - name: Commit updated price data
        run: |

          git config user.name "Thomson Clinic Price Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/drugs.json

          if git diff --cached --quiet; then
            echo "No price changes detected."
          else
            git commit -m "Update drug prices"
            git push
          fi